name: yacreader
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: graphics
priority: optional
maintainer: b0unt9
description: Yet another comic reader (with bundled Qt6)
homepage: https://www.yacreader.com/
license: GPL-3.0-only

contents:
  - src: ./build_out/opt/yacreader/
    dst: /opt/yacreader
    type: tree
  - src: ./build_out/usr/share/
    dst: /usr/share
    type: tree
  - src: /opt/yacreader/bin/YACReader
    dst: /usr/bin/YACReader
    type: symlink
  - src: /opt/yacreader/bin/YACReaderLibrary
    dst: /usr/bin/YACReaderLibrary
    type: symlink
  - src: /opt/yacreader/bin/YACReaderLibraryServer
    dst: /usr/bin/YACReaderLibraryServer
    type: symlink

overrides:
  deb:
    depends:
      - libarchive13t64 | libarchive13
      - libsqlite3-0
      - libgl1
      - libegl1
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libxcb-cursor0
      - libxcb-icccm4
      - libxcb-image0
      - libxcb-keysyms1
      - libxcb-randr0
      - libxcb-render-util0
      - libxcb-shape0
      - libxcb-xinerama0
      - libfontconfig1
      - libfreetype6
      - libopenjp2-7
      - libjpeg62-turbo | libjpeg8
      - libpng16-16t64 | libpng16-16
      - libtiff6 | libtiff5
      - liblcms2-2
      - libdbus-1-3
      - libpulse0
      - libasound2t64 | libasound2
      - libssl3t64 | libssl3