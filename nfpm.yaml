name: yacreader
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: graphics
priority: optional
maintainer: b0unt9
description: Yet another comic reader
homepage: https://www.yacreader.com/
license: GPL-3.0-only

contents:
  - src: ./build_out/usr/
    dst: /usr
    type: tree

overrides:
  deb:
    depends:
      - libqt6core6t64 | libqt6core6
      - libqt6gui6
      - libqt6widgets6
      - libqt6qml6
      - libqt6quick6
      - libqt6multimedia6
      - libqt6svg6
      - libqt6sql6-sqlite
      - libqt6openglwidgets6
      - libqt6core5compat6
      - libqt6texttospeech6
      - libpoppler-qt6-3t64 | libpoppler-qt6-3
      - libarchive13t64 | libarchive13
      - qml6-module-qtqml
      - qml6-module-qtqml-workerscript
      - qml6-module-qtquick
      - qml6-module-qtquick-controls
      - qml6-module-qtquick-layouts
      - qml6-module-qtquick-dialogs
      - qml6-module-qttexttospeech
      - qml6-module-qtquick-effects
      - qml6-module-qtquick-shapes
  rpm:
    depends:
      - qt6-qtbase
      - qt6-qtbase-gui
      - qt6-qtdeclarative
      - qt6-qtmultimedia
      - qt6-qtsvg
      - qt6-qt5compat
      - qt6-qtspeech
      - poppler-qt6
      - libarchive
  apk:
    depends:
      - qt6-qtbase
      - qt6-qtbase-sqlite
      - qt6-qtdeclarative
      - qt6-qtmultimedia
      - qt6-qtsvg
      - qt6-qt5compat
      - qt6-qtspeech
      - poppler-qt6
      - libarchive
  archlinux:
    depends:
      - qt6-base
      - qt6-declarative
      - qt6-multimedia
      - qt6-svg
      - qt6-5compat
      - qt6-speech
      - poppler-qt6
      - libarchive
      - sqlite