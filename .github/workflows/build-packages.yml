name: Build & Release Linux Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version"
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  build-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 24.04 / 26.04
          - distro: ubuntu-24.04
            image: ubuntu:24.04
            pkg_type: deb
            arch: amd64
            runner: ubuntu-26.04
          - distro: ubuntu-24.04
            image: ubuntu:24.04
            pkg_type: deb
            arch: arm64
            runner: ubuntu-26.04-arm
          - distro: ubuntu-26.04
            image: ubuntu:26.04
            pkg_type: deb
            arch: amd64
            runner: ubuntu-26.04
          - distro: ubuntu-26.04
            image: ubuntu:26.04
            pkg_type: deb
            arch: arm64
            runner: ubuntu-26.04-arm

          # Debian 12 / 13
          - distro: debian-12
            image: debian:12
            pkg_type: deb
            arch: amd64
            runner: ubuntu-26.04
          - distro: debian-12
            image: debian:12
            pkg_type: deb
            arch: arm64
            runner: ubuntu-26.04-arm
          - distro: debian-13
            image: debian:13
            pkg_type: deb
            arch: amd64
            runner: ubuntu-26.04
          - distro: debian-13
            image: debian:13
            pkg_type: deb
            arch: arm64
            runner: ubuntu-26.04-arm

          # Fedora 43 / 44
          - distro: fedora-43
            image: fedora:43
            pkg_type: rpm
            arch: amd64
            runner: ubuntu-26.04
          - distro: fedora-43
            image: fedora:43
            pkg_type: rpm
            arch: arm64
            runner: ubuntu-26.04-arm
          - distro: fedora-44
            image: fedora:44
            pkg_type: rpm
            arch: amd64
            runner: ubuntu-26.04
          - distro: fedora-44
            image: fedora:44
            pkg_type: rpm
            arch: arm64
            runner: ubuntu-26.04-arm

          # Alpine Linux
          - distro: alpine
            image: alpine:latest
            pkg_type: apk
            arch: amd64
            runner: ubuntu-26.04
          - distro: alpine
            image: alpine:latest
            pkg_type: apk
            arch: arm64
            runner: ubuntu-26.04-arm

    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build YACReader in ${{ matrix.distro }} (${{ matrix.arch }})
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace ${{ matrix.image }} sh -c '
            set -e
            if [ "${{ matrix.pkg_type }}" = "deb" ]; then
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends \
                build-essential cmake git pkg-config curl ca-certificates \
                qt6-base-dev qt6-base-private-dev qt6-declarative-dev \
                qt6-multimedia-dev qt6-svg-dev qt6-tools-dev qt6-l10n-tools \
                qt6-shadertools-dev libqt6opengl6-dev libqt6core5compat6-dev \
                libqt6sql6-sqlite qt6-speech-dev libpoppler-qt6-dev libarchive-dev
            elif [ "${{ matrix.pkg_type }}" = "rpm" ]; then
              dnf install -y -q \
                gcc-c++ cmake git pkgconf-pkg-config curl tar \
                qt6-qtbase-devel qt6-qtbase-private-devel qt6-qtdeclarative-devel \
                qt6-qtmultimedia-devel qt6-qtsvg-devel qt6-qttools-devel \
                qt6-qtshadertools-devel qt6-qt5compat-devel qt6-qtspeech-devel \
                poppler-qt6-devel libarchive-devel
            elif [ "${{ matrix.pkg_type }}" = "apk" ]; then
              apk add --no-cache \
                build-base cmake git pkgconf curl tar \
                qt6-qtbase-dev qt6-qtbase-private-dev qt6-qtdeclarative-dev \
                qt6-qtmultimedia-dev qt6-qtsvg-dev qt6-qttools-dev \
                qt6-qtshadertools-dev qt6-qt5compat-dev qt6-qtspeech-dev \
                poppler-qt6-dev libarchive-dev
            fi

            curl -L "https://github.com/YACReader/yacreader/archive/refs/tags/${{ inputs.version }}.tar.gz" -o source.tar.gz
            tar -xzf source.tar.gz
            cd yacreader-*
            cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DDECOMPRESSION_BACKEND=libarchive
            cmake --build build --parallel $(nproc)
            DESTDIR=/workspace/build_out cmake --install build
          '

      - name: Install nfpm and Package
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          mkdir -p dist
          VERSION="${{ inputs.version }}" ARCH="${{ matrix.arch }}" \
            $(go env GOPATH)/bin/nfpm pkg \
            --config nfpm.yaml \
            --packager ${{ matrix.pkg_type }} \
            --target dist/yacreader_${{ inputs.version }}_${{ matrix.distro }}_${{ matrix.arch }}.${{ matrix.pkg_type }}

      - name: Upload Package Artifact
        uses: actions/upload-artifact@v7
        with:
          name: yacreader-${{ matrix.distro }}-${{ matrix.arch }}
          path: dist/*
          retention-days: 1

  release:
    needs: build-package
    runs-on: ubuntu-26.04
    steps:
      - name: Download all package artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: yacreader-*
          path: release-assets
          merge-multiple: true

      - name: Generate Arch Linux PKGBUILD
        run: |
          VERSION="${{ inputs.version }}"
          TARBALL_URL="https://github.com/YACReader/yacreader/archive/refs/tags/${VERSION}.tar.gz"
          SHA256=$(curl -sL "${TARBALL_URL}" | sha256sum | awk '{print $1}')

          cat <<EOF > release-assets/PKGBUILD
          # Maintainer: b0unt9
          pkgname=yacreader
          pkgver=${VERSION}
          pkgrel=1
          pkgdesc="Yet another comic reader"
          arch=('x86_64' 'aarch64')
          url="https://www.yacreader.com/"
          license=('GPL-3.0-only')
          depends=('qt6-base' 'qt6-declarative' 'qt6-multimedia' 'qt6-svg' 'qt6-5compat' 'qt6-speech' 'poppler-qt6' 'libarchive' 'sqlite')
          makedepends=('cmake' 'git' 'qt6-tools' 'qt6-shadertools')
          source=("\${pkgname}-\${pkgver}.tar.gz::${TARBALL_URL}")
          sha256sums=('${SHA256}')

          build() {
            cmake -B build -S "\${pkgname}-\${pkgver}" \\
              -DCMAKE_BUILD_TYPE=Release \\
              -DCMAKE_INSTALL_PREFIX=/usr \\
              -DDECOMPRESSION_BACKEND=libarchive
            cmake --build build
          }

          package() {
            DESTDIR="\${pkgdir}" cmake --install build
          }
          EOF

      - name: Create Release and Upload Packages
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          files: release-assets/*
          generate_release_notes: true